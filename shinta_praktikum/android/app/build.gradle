plugins {
    id "com.android.application"
    id "kotlin-android"
    id "com.google.gms.google-services"  // 🔹 Pastikan plugin Firebase ada di sini
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.shinta_praktikum"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId "com.example.shinta_praktikum"
        minSdkVersion 23  // ✅ Perbaikan di sini!
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

// 🔹 Tambahkan dependensi Firebase
dependencies {
    implementation platform('com.google.firebase:firebase-bom:32.7.3')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
}

apply plugin: 'com.google.gms.google-services'  // 🔹 Plugin Google Services harus tetap di bagian akhir
